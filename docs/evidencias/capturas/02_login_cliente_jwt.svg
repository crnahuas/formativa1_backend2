<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="814" viewBox="0 0 1500 814">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<rect x="36" y="30" width="1428" height="754" rx="18" fill="#ffffff" stroke="#d7dce5"/>
<text x="70" y="44" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#152238">Login exitoso y JWT generado</text>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="18" fill="#526070">POST /api/auth/login autentica al cliente y retorna Bearer token</text>
<rect x="70" y="104" width="170" height="38" rx="8" fill="#17803d"/>
<text x="92" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HTTP 200</text>
<text x="70" y="182" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Solicitud</text>
<rect x="70" y="198" width="1360" height="112" rx="10" fill="#111827"/>

<text x="94" y="232" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">POST {{baseUrl}}/api/auth/login</text>
<text x="94" y="260" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">Content-Type: application/json</text>
<text x="94" y="288" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">{&quot;username&quot;:&quot;cliente&quot;,&quot;password&quot;:&quot;cliente123&quot;}</text>
<text x="70" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Respuesta</text>
<rect x="70" y="406" width="1360" height="252" rx="10" fill="#f8fafc" stroke="#d7dce5"/>
<text x="94" y="440" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">{</text>
<text x="94" y="468" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;token&quot;: &quot;eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGl...(recortado)&quot;,</text>
<text x="94" y="496" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;username&quot;: &quot;cliente&quot;,</text>
<text x="94" y="524" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;roles&quot;: [</text>
<text x="94" y="552" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;ROLE_CLIENTE&quot;</text>
<text x="94" y="580" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  ],</text>
<text x="94" y="608" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;tokenType&quot;: &quot;Bearer&quot;</text>
<text x="94" y="636" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">}</text>
</svg>