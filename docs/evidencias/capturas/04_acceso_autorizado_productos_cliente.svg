<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1458" viewBox="0 0 1500 1458">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<rect x="36" y="30" width="1428" height="1398" rx="18" fill="#ffffff" stroke="#d7dce5"/>
<text x="70" y="44" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#152238">Acceso autorizado por rol CLIENTE</text>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="18" fill="#526070">CLIENTE puede consultar productos</text>
<rect x="70" y="104" width="170" height="38" rx="8" fill="#17803d"/>
<text x="92" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HTTP 200</text>
<text x="70" y="182" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Solicitud</text>
<rect x="70" y="198" width="1360" height="110" rx="10" fill="#111827"/>

<text x="94" y="232" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">GET {{baseUrl}}/api/productos</text>
<text x="94" y="260" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">Authorization: Bearer {{clienteToken}}</text>
<text x="70" y="388" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Respuesta</text>
<rect x="70" y="404" width="1360" height="440" rx="10" fill="#f8fafc" stroke="#d7dce5"/>
<text x="94" y="438" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">[</text>
<text x="94" y="466" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  {</text>
<text x="94" y="494" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;categoria&quot;: {</text>
<text x="94" y="522" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">      &quot;id&quot;: 1,</text>
<text x="94" y="550" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">      &quot;nombre&quot;: &quot;Abarrotes&quot;</text>
<text x="94" y="578" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    },</text>
<text x="94" y="606" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;id&quot;: 1,</text>
<text x="94" y="634" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;nombre&quot;: &quot;Arroz Grano Largo 1kg&quot;,</text>
<text x="94" y="662" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;precio&quot;: 1500.0,</text>
<text x="94" y="690" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;stock&quot;: 50</text>
<text x="94" y="718" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  },</text>
<text x="94" y="746" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  {</text>
<text x="94" y="774" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">    &quot;categoria&quot;: {</text>
<text x="94" y="802" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">      &quot;id&quot;: 2,</text>
<text x="94" y="830" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">      &quot;nombre&quot;: &quot;Lácteos&quot;</text>
