<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="100%" height="100%" fill="#f5f7fb"/>
<rect x="36" y="30" width="1428" height="700" rx="18" fill="#ffffff" stroke="#d7dce5"/>
<text x="70" y="44" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#152238">Acceso denegado por rol</text>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="18" fill="#526070">CLIENTE no puede administrar usuarios</text>
<rect x="70" y="104" width="170" height="38" rx="8" fill="#b45309"/>
<text x="92" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">HTTP 403</text>
<text x="70" y="182" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Solicitud</text>
<rect x="70" y="198" width="1360" height="110" rx="10" fill="#111827"/>

<text x="94" y="232" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">GET {{baseUrl}}/api/usuarios</text>
<text x="94" y="260" font-family="Menlo, Consolas, monospace" font-size="18" fill="#e5e7eb">Authorization: Bearer {{clienteToken}}</text>
<text x="70" y="388" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152238">Respuesta</text>
<rect x="70" y="404" width="1360" height="150" rx="10" fill="#f8fafc" stroke="#d7dce5"/>
<text x="94" y="438" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">{</text>
<text x="94" y="466" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;error&quot;: &quot;Acceso denegado&quot;,</text>
<text x="94" y="494" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">  &quot;message&quot;: &quot;No tiene permisos para acceder a este recurso&quot;</text>
<text x="94" y="522" font-family="Menlo, Consolas, monospace" font-size="17" fill="#0f172a">}</text>
</svg>